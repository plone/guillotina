<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2450" viewBox="0 0 1600 2450" role="img" aria-labelledby="title desc">
  <title id="title">Guillotina OAuth requests and discovery paths</title>
  <desc id="desc">Sequence diagram showing every request a client can use to discover Guillotina OAuth metadata, register, authorize with PKCE, exchange tokens, call REST or MCP resources, refresh, and revoke.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#28545a"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#72818a"/>
    </marker>
    <style>
      .bg { fill: #f6f8fa; }
      .title { fill: #17252b; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #52666f; font: 14px Arial, sans-serif; }
      .actor { stroke-width: 1.2; rx: 10; ry: 10; }
      .client { fill: #eef7ff; stroke: #4f83b8; }
      .browser { fill: #fff7e8; stroke: #c8892d; }
      .oauth { fill: #eefaf4; stroke: #4d9b72; }
      .resource { fill: #f7f0ff; stroke: #8f60bd; }
      .actor-title { fill: #152329; font: 700 16px Arial, sans-serif; }
      .actor-sub { fill: #52666f; font: 12px Arial, sans-serif; }
      .lifeline { stroke: #d5dee6; stroke-width: 2; stroke-dasharray: 6 7; }
      .phase { fill: #e8edf3; stroke: #cfd9e3; stroke-width: 1; rx: 8; ry: 8; }
      .phase-text { fill: #24343b; font: 700 13px Arial, sans-serif; }
      .request { stroke: #28545a; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .response { stroke: #72818a; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-muted); }
      .local { stroke: #8899a5; stroke-width: 2; fill: none; stroke-dasharray: 3 5; }
      .card { fill: #ffffff; stroke: #cbd6df; stroke-width: 1; rx: 7; ry: 7; }
      .note { fill: #fffdf7; stroke: #dfc773; stroke-width: 1; rx: 8; ry: 8; }
      .ok { fill: #f0fbf5; stroke: #9bcfab; stroke-width: 1; rx: 8; ry: 8; }
      .card-title { fill: #17252b; font: 700 12px Arial, sans-serif; }
      .card-text { fill: #334a54; font: 12px Arial, sans-serif; }
      .card-small { fill: #61737c; font: 11px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="2450"/>
  <text class="title" x="800" y="38" text-anchor="middle">Guillotina OAuth: discovery, registration, authorization and token requests</text>
  <text class="subtitle" x="800" y="62" text-anchor="middle">The diagram shows the implemented request paths, including REST discovery, MCP cold-start discovery, PKCE, token refresh, and revoke.</text>

  <rect class="actor client" x="55" y="92" width="250" height="70"/>
  <text class="actor-title" x="180" y="120" text-anchor="middle">Client app</text>
  <text class="actor-sub" x="180" y="141" text-anchor="middle">Cursor, CLI, SPA, native app</text>

  <rect class="actor browser" x="420" y="92" width="250" height="70"/>
  <text class="actor-title" x="545" y="120" text-anchor="middle">Browser + user</text>
  <text class="actor-sub" x="545" y="141" text-anchor="middle">login and consent UI</text>

  <rect class="actor oauth" x="785" y="92" width="250" height="70"/>
  <text class="actor-title" x="910" y="120" text-anchor="middle">Guillotina OAuth</text>
  <text class="actor-sub" x="910" y="141" text-anchor="middle">authorization server in container</text>

  <rect class="actor resource" x="1160" y="92" width="330" height="70"/>
  <text class="actor-title" x="1325" y="120" text-anchor="middle">Protected resource</text>
  <text class="actor-sub" x="1325" y="141" text-anchor="middle">REST API or /@mcp/protocol</text>

  <line class="lifeline" x1="180" y1="162" x2="180" y2="2425"/>
  <line class="lifeline" x1="545" y1="162" x2="545" y2="2425"/>
  <line class="lifeline" x1="910" y1="162" x2="910" y2="2425"/>
  <line class="lifeline" x1="1325" y1="162" x2="1325" y2="2425"/>

  <rect class="phase" x="45" y="188" width="1510" height="30"/>
  <text class="phase-text" x="62" y="208">0. Cold-start discovery: how the client learns the OAuth URLs</text>

  <path class="request" d="M180 260 L910 260"/>
  <rect class="card" x="260" y="226" width="720" height="82"/>
  <text class="card-title" x="340" y="247">0A. REST/client already knows the container URL</text>
  <text class="card-text" x="340" y="266">GET /db/container/.well-known/oauth-authorization-server</text>
  <text class="card-small" x="340" y="282">Alternative RFC 8414 root path: /.well-known/oauth-authorization-server/db/container</text>
  <text class="card-small" x="340" y="298">OpenID Connect discovery is not exposed.</text>

  <path class="response" d="M910 350 L180 350"/>
  <rect class="card" x="330" y="325" width="690" height="50"/>
  <text class="card-title" x="365" y="345">200 authorization server metadata</text>
  <text class="card-text" x="365" y="362">issuer, authorization_endpoint, token_endpoint, registration_endpoint, revocation_endpoint</text>

  <path class="request" d="M180 430 L1325 430"/>
  <rect class="card" x="375" y="400" width="650" height="70"/>
  <text class="card-title" x="420" y="421">0B. MCP client knows only the MCP endpoint</text>
  <text class="card-text" x="420" y="440">POST /db/container/@mcp/protocol without Authorization header</text>
  <text class="card-small" x="420" y="456">This is the initial MCP cold start when no access token is available yet.</text>

  <path class="response" d="M1325 522 L180 522"/>
  <rect class="card" x="400" y="490" width="680" height="64"/>
  <text class="card-title" x="483" y="511">401 WWW-Authenticate</text>
  <text class="card-text" x="483" y="529">Bearer resource_metadata=</text>
  <text class="card-small" x="483" y="545">"/.well-known/oauth-protected-resource/db/container/@mcp/protocol"</text>

  <path class="request" d="M180 608 L910 608"/>
  <rect class="card" x="300" y="570" width="640" height="76"/>
  <text class="card-title" x="355" y="591">0C. Client follows resource_metadata</text>
  <text class="card-text" x="355" y="610">GET /.well-known/oauth-protected-resource/db/container/@mcp/protocol</text>
  <text class="card-small" x="355" y="626">Container-scoped equivalent: /db/container/.well-known/oauth-protected-resource</text>

  <path class="response" d="M910 689 L180 689"/>
  <rect class="card" x="372" y="665" width="385" height="48"/>
  <text class="card-title" x="407" y="685">200 protected resource metadata</text>
  <text class="card-text" x="407" y="702">resource, authorization_servers, scopes_supported</text>

  <rect class="note" x="990" y="565" width="500" height="100"/>
  <text class="card-title" x="1030" y="588">Implemented discovery variants</text>
  <text class="card-text" x="1030" y="608">OAuth AS metadata: oauth-authorization-server.</text>
  <text class="card-text" x="1030" y="628">MCP protected-resource metadata: oauth-protected-resource.</text>
  <text class="card-small" x="1030" y="648">OpenID Connect discovery is intentionally not served.</text>

  <rect class="phase" x="45" y="740" width="1510" height="30"/>
  <text class="phase-text" x="62" y="760">1. Dynamic client registration</text>

  <path class="request" d="M180 831 L910 831"/>
  <rect class="card" x="310" y="795" width="575" height="72"/>
  <text class="card-title" x="355" y="816">1. Register public client</text>
  <text class="card-text" x="355" y="835">POST /db/container/oauth/register</text>
  <text class="card-small" x="355" y="851">JSON: client_name, redirect_uris[], token_endpoint_auth_method=&quot;none&quot;</text>

  <path class="response" d="M910 909 L180 909"/>
  <rect class="card" x="330" y="885" width="510" height="48"/>
  <text class="card-title" x="375" y="905">200 registration response</text>
  <text class="card-text" x="375" y="921">server-issued client_id; client-supplied client_id is rejected</text>

  <rect class="ok" x="990" y="805" width="500" height="100"/>
  <text class="card-title" x="1030" y="828">Security behavior</text>
  <text class="card-text" x="1030" y="848">Registration is create-only: no upsert and no redirect_uri merge.</text>
  <text class="card-text" x="1030" y="868">Clients needing several callbacks must register all redirect_uris at once.</text>

  <rect class="phase" x="45" y="970" width="1510" height="30"/>
  <text class="phase-text" x="62" y="990">2. Authorization code with PKCE</text>

  <path class="local" d="M180 1045 C120 1045 120 1095 180 1095"/>
  <rect class="note" x="58" y="1020" width="370" height="88"/>
  <text class="card-title" x="76" y="1043">2A. Local PKCE step</text>
  <text class="card-text" x="76" y="1063">No HTTP request.</text>
  <text class="card-text" x="76" y="1081">Generate code_verifier and S256 code_challenge.</text>
  <text class="card-small" x="76" y="1097">Keep code_verifier on the client.</text>

  <path class="request" d="M180 1157 L545 1157"/>
  <rect class="card" x="250" y="1130" width="270" height="54"/>
  <text class="card-title" x="275" y="1151">2B. Open browser</text>
  <text class="card-text" x="275" y="1168">Navigate user to authorization URL</text>

  <path class="request" d="M545 1270 L910 1270"/>
  <rect class="card" x="545" y="1225" width="450" height="90"/>
  <text class="card-title" x="595" y="1246">2C. GET authorize</text>
  <text class="card-text" x="595" y="1265">GET /db/container/oauth/authorize</text>
  <text class="card-small" x="595" y="1281">response_type=code, client_id, redirect_uri, state</text>
  <text class="card-small" x="595" y="1297">code_challenge, code_challenge_method=S256</text>
  <text class="card-small" x="595" y="1312">scope optional; resource optional</text>

  <path class="response" d="M910 1360 L545 1360"/>
  <rect class="card" x="575" y="1335" width="400" height="50"/>
  <text class="card-title" x="615" y="1355">HTML login/consent page</text>
  <text class="card-text" x="615" y="1372">shown when authentication or consent is needed</text>

  <path class="request" d="M545 1444 L910 1444"/>
  <rect class="card" x="570" y="1410" width="420" height="68"/>
  <text class="card-title" x="610" y="1431">2D. POST consent decision</text>
  <text class="card-text" x="610" y="1450">POST /db/container/oauth/authorize</text>
  <text class="card-small" x="610" y="1466">decision=allow plus original authorize parameters</text>

  <path class="response" d="M910 1525 L545 1525"/>
  <rect class="card" x="575" y="1500" width="415" height="50"/>
  <text class="card-title" x="615" y="1520">302 redirect</text>
  <text class="card-text" x="615" y="1537">Location: redirect_uri?code=goc_...&amp;state=...</text>

  <path class="response" d="M545 1595 L180 1595"/>
  <rect class="card" x="240" y="1570" width="360" height="50"/>
  <text class="card-title" x="287" y="1590">2E. Callback to client</text>
  <text class="card-text" x="287" y="1607">Client receives code and validates state</text>

  <rect class="ok" x="1010" y="1240" width="500" height="118"/>
  <text class="card-title" x="1030" y="1263">Implemented authorize variants</text>
  <text class="card-text" x="1030" y="1283">resource omitted: defaults to the container issuer URL.</text>
  <text class="card-text" x="1030" y="1303">resource = /@mcp/protocol: token audience is the MCP endpoint.</text>
  <text class="card-text" x="1030" y="1323">scope omitted: empty scope claim; otherwise use guillotina:access.</text>
  <text class="card-small" x="1030" y="1343">PKCE is required by default; tests can disable it via configuration.</text>

  <rect class="phase" x="45" y="1660" width="1510" height="30"/>
  <text class="phase-text" x="62" y="1680">3. Token endpoint grants</text>

  <path class="request" d="M180 1760 L910 1760"/>
  <rect class="card" x="300" y="1720" width="580" height="80"/>
  <text class="card-title" x="345" y="1741">3A. Exchange authorization code</text>
  <text class="card-text" x="345" y="1760">POST /db/container/oauth/token</text>
  <text class="card-small" x="345" y="1776">grant_type=authorization_code, client_id, redirect_uri, code</text>
  <text class="card-small" x="345" y="1792">code_verifier, optional resource subset</text>

  <path class="response" d="M910 1848 L180 1848"/>
  <rect class="card" x="340" y="1820" width="450" height="56"/>
  <text class="card-title" x="375" y="1840">200 token response</text>
  <text class="card-text" x="375" y="1857">access_token = JWT, refresh_token = opaque token</text>
  <text class="card-small" x="375" y="1870">JWT aud equals container URL or MCP protocol URL.</text>

  <path class="request" d="M180 1931 L910 1931"/>
  <rect class="card" x="310" y="1900" width="500" height="62"/>
  <text class="card-title" x="345" y="1921">3B. Refresh token grant</text>
  <text class="card-text" x="345" y="1940">POST /db/container/oauth/token</text>
  <text class="card-small" x="345" y="1956">grant_type=refresh_token, client_id, refresh_token</text>

  <path class="response" d="M910 2012 L180 2012"/>
  <rect class="card" x="338" y="1984" width="465" height="56"/>
  <text class="card-title" x="373" y="2004">200 rotated token response</text>
  <text class="card-text" x="373" y="2021">new access_token and new refresh_token</text>
  <text class="card-small" x="373" y="2034">Reusing an old refresh token revokes its rotation family.</text>

  <rect class="phase" x="45" y="2070" width="1510" height="30"/>
  <text class="phase-text" x="62" y="2090">4. Use and revoke</text>

  <path class="request" d="M180 2165 L1325 2165"/>
  <rect class="card" x="375" y="2125" width="740" height="80"/>
  <text class="card-title" x="440" y="2146">4A. Call protected resource</text>
  <text class="card-text" x="440" y="2165">REST: GET /db/container/... or MCP: POST /db/container/@mcp/protocol</text>
  <text class="card-small" x="440" y="2181">Header: Authorization: Bearer ACCESS_TOKEN</text>
  <text class="card-small" x="440" y="2197">Guillotina then checks normal user permissions.</text>

  <path class="response" d="M1325 2250 L180 2250"/>
  <rect class="card" x="465" y="2225" width="555" height="50"/>
  <text class="card-title" x="520" y="2245">200 / 401 / 403 response</text>
  <text class="card-text" x="520" y="2262">Depends on token validity, audience/resource, and Guillotina permissions.</text>

  <path class="request" d="M180 2329 L910 2329"/>
  <rect class="card" x="310" y="2295" width="570" height="68"/>
  <text class="card-title" x="353" y="2316">4B. Optional revoke</text>
  <text class="card-text" x="353" y="2335">POST /db/container/oauth/revoke</text>
  <text class="card-small" x="353" y="2351">client_id, token=REFRESH_TOKEN, token_type_hint=refresh_token</text>

  <path class="response" d="M910 2399 L180 2399"/>
  <rect class="card" x="403" y="2380" width="310" height="38"/>
  <text class="card-title" x="438" y="2401">200 revoke response</text>
</svg>
